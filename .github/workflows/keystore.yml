name: "Bước 1 (làm 1 lần): Tạo khóa ký app"
on: workflow_dispatch
jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Tạo keystore
        run: |
          PASS=$(openssl rand -hex 12)
          keytool -genkeypair -v -keystore release.jks -alias c3d -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=Container 3D, O=Container 3D, C=VN"
          base64 -w0 release.jks > KEYSTORE_BASE64.txt
          printf 'KEYSTORE_PASSWORD=%s\nKEY_PASSWORD=%s\nKEY_ALIAS=c3d\n' "$PASS" "$PASS" > secrets.txt
      - uses: actions/upload-artifact@v4
        with:
          name: khoa-ky-app-GIU-BI-MAT
          path: |
            release.jks
            KEYSTORE_BASE64.txt
            secrets.txt
          retention-days: 3
